services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_ORIGINS: "http://127.0.0.1:5500,http://localhost:5500"
    volumes:
      - ollama-data:/root/.ollama

  backend:
      image: node:24
      working_dir: /app
      user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
      environment:
        HOME: /tmp
        OLLAMA_BASE_URL: "http://ollama:11434"
      ports:
        - "3000:3000"
      volumes:
        - ./backend:/app
        - backend_node_modules:/app/node_modules
      depends_on:
        - ollama
      command: sh -c "npm ci && npm run start:dev"

  frontend:
    build:
      context: ./frontend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  ollama-data:
      external: true
      name: reviso_ollama-data
  backend_node_modules:
  frontend_node_modules: